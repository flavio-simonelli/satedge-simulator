# Tipi di satellite del caso studio: COM, SAR e VHR. I valori presi da topology.yaml sono quelli
# del caso di studio. Le antenne elencano il tipo di link che servono e la velocità.
#
# La disponibilità dell'HPC si scrive come quella dei link (kind: always, periodic o windows):
#   kind: periodic   -> first_start_s (facoltativo, 0), period_s, duration_s
#   kind: windows    -> windows: [{start_s, end_s}, ...]
# startup_s è il tempo di avvio dei container all'inizio di ogni disponibilità.
#
# Esempio con la forma esplicita, con le stesse prime due finestre del caso periodico:
#   availability:
#     kind: windows
#     windows: [{start_s: 0, end_s: 300}, {start_s: 5640, end_s: 5940}]
schema_version: "1.0.0"
satellite_types:
  com:
    description: satellite COM del piano, collegato agli altri piani e alla stazione a terra
    plmm:
      capacity_gb: 2000
    hpc:
      rate_gbps: 1.0
      memory_gb: 2000           # uguale alla capacità della PLMM
      startup_s: 0
      availability:
        kind: periodic
        period_s: 5640
        duration_s: 300
    antennas:
      - link: intra_orbit       # collegamento con il satellite successivo del piano
        rate_gbps: 1.0
      - link: intra_orbit       # collegamento con il satellite precedente del piano
        rate_gbps: 1.0
      - link: inter_orbit       # collegamento con i COM degli altri piani
        rate_gbps: 1.0
      - link: ground            # collegamento con la stazione a terra
        rate_gbps: 1.0
  sar:
    description: satellite SAR, collegato solo ai vicini del piano
    plmm:
      capacity_gb: 2000
    hpc:
      rate_gbps: 1.0
      memory_gb: 2000           # uguale alla capacità della PLMM
      startup_s: 0
      availability:
        kind: periodic
        period_s: 5640
        duration_s: 300
    antennas:
      - link: intra_orbit
        rate_gbps: 1.0
      - link: intra_orbit
        rate_gbps: 1.0
  vhr:
    description: satellite VHR, con le stesse antenne del SAR e il doppio di memoria
    plmm:
      capacity_gb: 4000
    hpc:
      rate_gbps: 1.0
      memory_gb: 4000           # uguale alla capacità della PLMM
      startup_s: 0
      availability:
        kind: periodic
        period_s: 5640
        duration_s: 300
    antennas:
      - link: intra_orbit
        rate_gbps: 1.0
      - link: intra_orbit
        rate_gbps: 1.0
