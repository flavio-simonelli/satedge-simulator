# SonarCloud configuration.
sonar.projectKey=flavio-simonelli_satedge-simulator
sonar.organization=flavio-simonelli

sonar.projectName=satedge-simulator
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.13

# Report di copertura generato in CI da pytest-cov
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Code ported from outside (rngs.c, rvgs.c, rvms.c of Park and Geyer, via Philip Steele):
# it stays faithful to the original, which is trusted, so it is neither analysed nor tested.
sonar.exclusions=**/py.typed,\
  src/satedge_simulator/rng/rngs.py,\
  src/satedge_simulator/rng/rvgs.py,\
  src/satedge_simulator/rng/rvms.py
sonar.sourceEncoding=UTF-8
