# SonarCloud configuration.
sonar.projectKey=flavio-simonelli_satedge-simulator
sonar.organization=flavio-simonelli

sonar.projectName=satedge-simulator
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.13

# Report di copertura generato in CI da pytest-cov
sonar.python.coverage.reportPaths=coverage.xml
